<svg xmlns="http://www.w3.org/2000/svg" width="820" height="170" viewBox="0 0 820 170" role="img" aria-label="Ron, the AI assistant on Prabor's portfolio. Say hi!">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171229"/>
      <stop offset="1" stop-color="#241a4a"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }

    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    .ron { animation: bob 3s ease-in-out infinite; }

    @keyframes blink { 0%, 88%, 100% { transform: scaleY(1); } 92% { transform: scaleY(0.1); } }
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .light { animation: pulse 1.8s ease-in-out infinite; }

    @keyframes say {
      0%   { opacity: 0; transform: translateY(8px); }
      4%   { opacity: 1; transform: translateY(0); }
      30%  { opacity: 1; transform: translateY(0); }
      34%  { opacity: 0; transform: translateY(-8px); }
      100% { opacity: 0; transform: translateY(-8px); }
    }
    .say { opacity: 0; font-size: 23px; fill: #ffffff; animation: say 12s ease-in-out infinite; }

    @keyframes ping { 0% { r: 5; opacity: 0.8; } 100% { r: 12; opacity: 0; } }
    .ping { animation: ping 1.8s ease-out infinite; }
  </style>

  <rect x="1" y="1" width="818" height="168" rx="16" fill="url(#bg)" stroke="#2b2152" stroke-width="2"/>

  <!-- Ron -->
  <g transform="translate(38 22) scale(1.9)"><g class="ron">
    <line x1="32" y1="12" x2="32" y2="6" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
    <circle class="light" cx="32" cy="4.5" r="3.5" fill="#f472b6" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="4" y="27" width="7" height="13" rx="2.5" fill="#bfe8d0" stroke="#1a1a1a" stroke-width="2.5"/>
    <rect x="53" y="27" width="7" height="13" rx="2.5" fill="#bfe8d0" stroke="#1a1a1a" stroke-width="2.5"/>
    <rect x="10" y="12" width="44" height="42" rx="15" fill="#f6c945" stroke="#1a1a1a" stroke-width="2.5"/>
    <rect x="16" y="22" width="32" height="20" rx="8" fill="#fdf6dc" stroke="#1a1a1a" stroke-width="1.5"/>
    <ellipse class="eye" cx="25" cy="32" rx="3.2" ry="4.2" fill="#1a1a1a"/>
    <ellipse class="eye" cx="39" cy="32" rx="3.2" ry="4.2" fill="#1a1a1a"/>
    <circle cx="26.2" cy="30.4" r="1" fill="#fdf6dc"/>
    <circle cx="40.2" cy="30.4" r="1" fill="#fdf6dc"/>
    <circle cx="18" cy="40" r="3" fill="#f472b6" opacity="0.6"/>
    <circle cx="46" cy="40" r="3" fill="#f472b6" opacity="0.6"/>
    <path d="M27 46 Q32 50.5 37 46" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  </g></g>

  <!-- online dot -->
  <circle class="ping" cx="160" cy="138" r="5" fill="#3fbf7f"/>
  <circle cx="160" cy="138" r="5" fill="#3fbf7f" stroke="#171229" stroke-width="2"/>

  <!-- speech bubble -->
  <path d="M196 42 a14 14 0 0 1 14 -14 H780 a14 14 0 0 1 14 14 V108 a14 14 0 0 1 -14 14 H225 L200 142 L204 122 a14 14 0 0 1 -8 -12 Z" fill="#1d1636" stroke="#C3A6FF" stroke-opacity="0.6" stroke-width="2"/>

  <text class="say" x="230" y="82" style="animation-delay:0s">Hi, I'm Ron, Prabor's AI agent.</text>
  <text class="say" x="230" y="82" style="animation-delay:4s">Ask me about his apps and experience.</text>
  <text class="say" x="230" y="82" style="animation-delay:8s">Come say hi on his portfolio!</text>

  <text class="mono" x="780" y="148" text-anchor="end" font-size="13" fill="#C3A6FF" letter-spacing="1.5">CHAT WITH RON  →</text>
</svg>
